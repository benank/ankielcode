name: Release

on:
  release:
    # Publish-triggered flow: publish a release in GitHub with a tag (e.g. v0.2.0).
    # This workflow builds macOS arm64 + Windows x64 desktop installers and the standalone CLI
    # archives, then attaches them, checksums, the install scripts, and electron-updater
    # manifests to the published release.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.2.0). Reuses an existing release with this tag or creates a new draft."
        required: true
        type: string
      publish_draft:
        description: "Publish the draft release automatically after uploading assets"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    if: github.event_name == 'workflow_dispatch' || github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      publish_draft: ${{ steps.resolve.outputs.publish_draft }}
    steps:
      - id: resolve
        name: Resolve release and target commit
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH_DRAFT: ${{ inputs.publish_draft }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            let releaseId;
            let tag;
            let targetCommitish;
            let publishDraft;

            if (context.eventName === 'release') {
              const release = context.payload.release;
              if (!release || release.draft) {
                core.setFailed('Only published releases trigger automated builds.');
                return;
              }
              releaseId = String(release.id);
              tag = (release.tag_name || '').trim();
              targetCommitish = tag || (release.target_commitish || context.payload.repository.default_branch || 'main').trim();
              publishDraft = 'false';
            } else {
              tag = (process.env.INPUT_TAG || '').trim();
              targetCommitish = context.sha;
              publishDraft = process.env.INPUT_PUBLISH_DRAFT === 'true' ? 'true' : 'false';
            }

            if (!/^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$/.test(tag)) {
              core.setFailed(`Release tag must match vX.Y.Z (got "${tag}").`);
              return;
            }
            const version = tag.slice(1);
            const isPrerelease = version.includes('-');

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: targetCommitish,
            });
            const pinnedSha = commit.sha;

            if (!releaseId) {
              const { data: releases } = await github.rest.repos.listReleases({
                owner,
                repo,
                per_page: 50,
              });
              const existing = releases.find((r) => r.tag_name === tag);
              if (existing) {
                releaseId = String(existing.id);
                core.info(`Reusing existing release #${releaseId} for ${tag} (draft=${existing.draft}).`);
              } else {
                const { data: created } = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  target_commitish: pinnedSha,
                  name: tag,
                  draft: true,
                  prerelease: isPrerelease,
                  generate_release_notes: true,
                });
                releaseId = String(created.id);
                core.info(`Created draft release #${releaseId} for ${tag}.`);
              }
            }

            core.info(`Building ${tag} (version ${version}) from ${pinnedSha} -> release #${releaseId}`);
            core.setOutput('release_id', releaseId);
            core.setOutput('tag', tag);
            core.setOutput('version', version);
            core.setOutput('ref', pinnedSha);
            core.setOutput('publish_draft', publishDraft);

  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve workspace package filters
        id: pkgs
        shell: bash
        run: |
          desktop=$(jq -r '.name' apps/desktop/package.json)
          server=$(jq -r '.name' apps/server/package.json)
          web=$(jq -r '.name' apps/web/package.json)
          scripts=$(jq -r '.name' scripts/package.json)
          echo "install_args=--filter=${server}... --filter=${web}... --filter=${desktop}... --filter=${scripts}..." >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ steps.pkgs.outputs.install_args }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build shared JS bundle
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@v4
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  package_desktop:
    name: Package ${{ matrix.label }}
    needs: [preflight, build_bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve workspace package filters
        id: pkgs
        shell: bash
        run: |
          desktop=$(jq -r '.name' apps/desktop/package.json)
          server=$(jq -r '.name' apps/server/package.json)
          scripts=$(jq -r '.name' scripts/package.json)
          echo "install_args=--filter=${desktop}... --filter=${server}... --filter=${scripts}..." >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ steps.pkgs.outputs.install_args }}

      - name: Resolve staged install cache
        id: stage_pnpm
        shell: bash
        run: |
          echo "dir=$RUNNER_TEMP/desktop-stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "prefix=desktop-stage-pnpm-v2-${{ matrix.platform }}-${{ matrix.arch }}-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore staged install cache
        id: stage_pnpm_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.stage_pnpm.outputs.prefix }}

      - name: Mark staged install cache
        shell: bash
        run: mkdir -p "${{ steps.stage_pnpm.outputs.dir }}" && touch "$RUNNER_TEMP/desktop-stage-pnpm.marker"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v4
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/*resource-monitor*
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Align package versions to release version
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@v4
        with:
          name: js-bundle
          path: apps

      - name: Build desktop artifact
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: "true"
          ANKIEL_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.ANKIEL_APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --skip-build
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              profile_path="$RUNNER_TEMP/ankiel.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
              security cms -D -i "$profile_path" >/dev/null
              export ANKIEL_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              export ANKIEL_MACOS_PROVISIONING_PROFILE="$profile_path"

              echo "macOS signing and notarization enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (secrets not configured); building unsigned."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (secrets not configured); building unsigned."
            fi
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Save staged install cache
        if: steps.stage_pnpm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm_cache.outputs.cache-primary-key }}

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob

          for pattern in "release/*.dmg" "release/*.zip" "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              [[ "$(basename "$file")" == "builder-debug.yml" ]] && continue
              cp "$file" release-publish/
            done
          done

          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi

          if [[ "${{ matrix.platform }}" == "win" ]]; then
            for manifest in release-publish/*.yml; do
              mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
            done
          fi

          ls -lh release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0

  # Standalone CLI archives for install.sh/install.ps1, SSH remotes, and server self-updates.
  # Keys match CLI_ARCHIVE_PLATFORM_KEYS in packages/shared/src/cliRelease.ts. There is no
  # darwin-x64 archive (Node single-executables segfault there) and no win32-arm64 archive.
  # build-exe bundles from source, so these legs do not wait for the JS bundle.
  cli_archive:
    name: CLI archive ${{ matrix.label }}
    needs: [preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          # Linux arm64 single-executables must be built on arm64 hardware (see build-exe).
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve workspace package filters
        id: pkgs
        shell: bash
        run: |
          server=$(jq -r '.name' apps/server/package.json)
          scripts=$(jq -r '.name' scripts/package.json)
          echo "install_args=--filter=${server}... --filter=${scripts}..." >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ steps.pkgs.outputs.install_args }}

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v4
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/*resource-monitor*
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Align package versions to release version
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build CLI single-executable
        shell: bash
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="ankiel-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}" "$target_dir/$binary_name"

      # The Linux archive ships libatomic.so.1 and points ankiel's RUNPATH at it.
      - name: Install patchelf
        if: matrix.platform == 'linux'
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "macOS CLI signing disabled (secrets not configured); the archive is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/ankiel-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          cert_path="$RUNNER_TEMP/ankiel-cli-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in CSC_LINK." >&2
            exit 1
          fi
          echo "ANKIEL_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "macOS CLI signing enabled."

      # build-cli-archive signs ankiel.exe with Invoke-TrustedSigning on Windows hosts.
      - name: Install Trusted Signing module
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          if (-not $env:AZURE_TRUSTED_SIGNING_ENDPOINT) {
            Write-Host "Windows CLI signing disabled (secrets not configured)."
            exit 0
          }
          Install-Module -Name TrustedSigning -Scope CurrentUser -Force -AllowClobber

      - name: Build CLI archive
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "mac" && -n "${APPLE_API_KEY:-}" ]]; then
            key_path="$RUNNER_TEMP/ankiel-cli-AuthKey.p8"
            (umask 077 && printf '%s' "$APPLE_API_KEY" > "$key_path")
            export APPLE_API_KEY="$key_path"
          fi
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          stem="ankiel-$VERSION-${{ matrix.resource_key }}"
          smoke="$RUNNER_TEMP/cli-smoke"
          mkdir -p "$smoke"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            # System32 bsdtar reads zip; Git Bash's GNU tar does not.
            "$(cygpath -S)/tar.exe" -xf "release-cli/$stem.zip" -C "$smoke"
            output="$("$smoke/$stem/ankiel.exe" --version)"
          else
            tar -xzf "release-cli/$stem.tar.gz" -C "$smoke"
            output="$("$smoke/$stem/ankiel" --version)"
          fi
          output="${output%$'\r'}"
          echo "$output"
          if [[ "$output" != "ankiel v$VERSION" ]]; then
            echo "Expected ankiel --version to print ankiel v$VERSION." >&2
            exit 1
          fi

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error
          # The archive is already gzip or zip.
          compression-level: 0

  # Checks that only matter for shipping, run against the release commit while
  # the installers build. Publishing waits for them.
  release_checks:
    name: Release checks
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/ankiel-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config xvfb

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @ankielcode/desktop ensure:electron

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      # build-exe rejects imports a single-executable cannot resolve.
      - name: Build CLI single-executable
        run: |
          node apps/server/scripts/cli.ts build-exe
          apps/server/dist-exe/ankiel --version

      - name: Open the seeded thread in the built desktop app
        id: desktop_launch
        timeout-minutes: 4
        run: |
          electron=$(node -p "require('./apps/desktop/node_modules/electron')")
          xvfb-run -a node scripts/smoke-desktop-app.ts --executable "$electron" --app apps/desktop \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"

      - name: Upload desktop launch check
        if: ${{ failure() && steps.desktop_launch.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-launch-check
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

      # Browser tests run source modules; this boots the production chunk graph.
      - name: Install Chromium for the built web client boot check
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Boot the built web client
        timeout-minutes: 3
        run: node apps/web/scripts/verify-built-boot.ts

  publish_release:
    name: Upload assets & publish release
    needs: [preflight, package_desktop, cli_archive, release_checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve scripts package filter
        id: pkgs
        shell: bash
        run: |
          scripts=$(jq -r '.name' scripts/package.json)
          echo "install_args=--filter=${scripts}..." >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ steps.pkgs.outputs.install_args }}

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Normalize updater manifests
        run: node scripts/merge-release-update-manifests.ts --allow-single-arch release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # install.sh, install.ps1, SSH remotes, and server self-updates verify CLI archives against
      # SHA256SUMS (CLI_RELEASE_CHECKSUMS_FILE). SHA256SUMS.txt covers every download.
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(ankiel-*.tar.gz ankiel-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives found to checksum." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
          downloads=(*.dmg *.zip *.exe *.tar.gz)
          sha256sum "${downloads[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # code.ankiel.com/install.sh and /install.ps1 redirect to these assets on the latest release.
      - name: Stage install scripts
        run: cp scripts/install.sh scripts/install.ps1 release-assets/

      # Update track switches read the highest server migration from this asset before they
      # move a database to this release (packages/shared/src/cliRelease.ts).
      - name: Write release metadata
        shell: bash
        run: |
          set -euo pipefail
          migration=$(ls apps/server/src/persistence/Migrations | sed -nE 's/^([0-9]+)_[A-Za-z0-9_]+\.ts$/\1/p' | sort -n | tail -1)
          if [[ -z "$migration" ]]; then
            echo "No server migrations found." >&2
            exit 1
          fi
          printf '{"databaseMigration":%d}\n' "$((10#$migration))" > release-assets/ankiel-release.json
          cat release-assets/ankiel-release.json

      - name: Upload assets to release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
          PINNED_REF: ${{ needs.preflight.outputs.ref }}
          PUBLISH_DRAFT: ${{ needs.preflight.outputs.publish_draft }}
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const assetsDir = path.resolve('release-assets');

            const allFiles = fs
              .readdirSync(assetsDir)
              .filter((name) => name !== 'builder-debug.yml')
              .sort();

            // Installers, archives, and blockmaps go first. Checksums, release metadata, and the
            // install scripts follow, since installers and server updates treat SHA256SUMS as the
            // release being ready. Updater manifests (latest*.yml) go last so desktop updaters
            // never observe missing targets.
            const pointerNames = new Set(['SHA256SUMS', 'SHA256SUMS.txt', 'ankiel-release.json', 'install.sh', 'install.ps1']);
            const manifests = allFiles.filter((name) => name.endsWith('.yml'));
            const pointers = allFiles.filter((name) => pointerNames.has(name));
            const binaries = allFiles.filter((name) => !name.endsWith('.yml') && !pointerNames.has(name));
            const uploadOrder = [...binaries, ...pointers, ...manifests];

            const { data: existingAssets } = await github.rest.repos.listReleaseAssets({
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });
            const existingByName = new Map(existingAssets.map((asset) => [asset.name, asset.id]));

            for (const fileName of uploadOrder) {
              const existingId = existingByName.get(fileName);
              if (existingId) {
                core.info(`Replacing existing release asset ${fileName} (#${existingId})`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existingId,
                });
              }

              const filePath = path.join(assetsDir, fileName);
              const data = fs.readFileSync(filePath);
              const contentType = fileName.endsWith('.yml')
                ? 'text/yaml'
                : fileName.endsWith('.txt') || fileName.endsWith('.sh') || fileName.endsWith('.ps1') || fileName === 'SHA256SUMS'
                  ? 'text/plain'
                  : fileName.endsWith('.json')
                    ? 'application/json'
                    : 'application/octet-stream';

              core.info(`Uploading ${fileName} (${data.byteLength} bytes)...`);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: releaseId,
                name: fileName,
                data,
                headers: {
                  'content-type': contentType,
                  'content-length': data.byteLength,
                },
              });
            }

            if (process.env.PUBLISH_DRAFT === 'true') {
              core.info(`Publishing draft release #${releaseId} at ${process.env.PINNED_REF}...`);
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: releaseId,
                draft: false,
                target_commitish: process.env.PINNED_REF,
              });
            } else {
              core.info(`Uploaded all assets to release #${releaseId}.`);
            }
