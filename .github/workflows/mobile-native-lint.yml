name: Mobile Native Lint

# macOS minutes cost ~6.7x Linux ones, so this runs only for native mobile sources.
on:
  pull_request:
    paths: &native_paths
      - "apps/mobile/**/*.swift"
      - "apps/mobile/**/*.kt"
      - "apps/mobile/**/*.kts"
      - "apps/mobile/.swiftlint.yml"
      - "apps/mobile/detekt.yml"
      - "apps/mobile/.editorconfig"
      - "apps/mobile/Brewfile"
      - "scripts/mobile-native-static-check.ts"
      - ".github/workflows/mobile-native-lint.yml"
  push:
    branches:
      - main
    paths: *native_paths

permissions:
  contents: read

jobs:
  lint:
    name: Mobile Native Static Analysis
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@ankielcode/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile
