name: Ankiel Relay

# Deploys are manual: `npm run setup` (or `npm run deploy`) in relay/.

on:
  push:
    branches:
      - main
    paths:
      - "relay/**"
      - ".github/workflows/ankiel-relay-deploy.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/ankiel-relay-deploy.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
