    <style>
      :root {
        color-scheme: dark;
        --bg: #030508;
        --ink: #f5f8fc;
        --muted: rgba(226, 236, 248, 0.58);
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --sans:
          "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .hero {
        position: relative;
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 34px 56px 56px;
        overflow: hidden;
        background: var(--bg);
      }

      canvas#canopy {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      /* Soft atmospheric fade dissolving the burnt canopy cleanly into obsidian */
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(3, 5, 8, 0) 0%,
          rgba(3, 5, 8, 0) 46%,
          rgba(3, 5, 8, 0.84) 76%,
          var(--bg) 100%
        );
        pointer-events: none;
        z-index: 1;
      }

      .brand-bar {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .brand svg {
        height: 12px;
        width: auto;
        display: block;
        color: #ffffff;
      }

      .brand span {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(235, 246, 255, 0.76);
        line-height: 1;
      }

      .hero-bottom {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 56px;
        margin-top: auto;
      }

      .hero-left {
        max-width: 640px;
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(44px, 5.2vw, 68px);
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: -0.042em;
        color: #f7faff;
      }

      .sub {
        margin: 0;
        max-width: 560px;
        font-size: clamp(16px, 1.55vw, 19px);
        font-weight: 300;
        line-height: 1.55;
        letter-spacing: -0.01em;
        color: var(--muted);
      }

      .download-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 268px;
        flex-shrink: 0;
      }

      .btn-glass {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px 20px;
        background: rgba(242, 248, 255, 0.06);
        border: 1px solid rgba(220, 240, 255, 0.16);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: #f6faff;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .btn-glass:hover {
        background: rgba(242, 248, 255, 0.12);
        border-color: rgba(145, 232, 255, 0.48);
        box-shadow: 0 0 30px -6px rgba(56, 214, 255, 0.35);
      }

      .btn-glass.primary {
        background: #f6faff;
        color: #04070d;
        border-color: #f6faff;
        box-shadow: 0 0 38px -8px rgba(86, 220, 255, 0.52);
      }

      .btn-glass.primary:hover {
        background: #ffffff;
        border-color: #ffffff;
        box-shadow: 0 0 44px -6px rgba(112, 232, 255, 0.68);
      }

      @media (max-width: 900px), (max-height: 620px) {
        html,
        body {
          height: auto;
          overflow-x: hidden;
          overflow-y: auto;
        }
        .hero {
          height: auto;
          min-height: 100dvh;
          padding: 26px 24px 44px;
        }
        .hero-bottom {
          flex-direction: column;
          align-items: stretch;
          gap: 32px;
          padding-top: 200px;
        }
        .download-col {
          width: 100%;
          max-width: 340px;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <canvas id="canopy" aria-hidden="true"></canvas>

      <header class="brand-bar">
        <a class="brand" href="/" aria-label="Ankiel Code">
          <svg viewBox="40 40 943.85 200" fill="currentColor" aria-hidden="true" focusable="false">
            <path
              d="M122.2 40h25.6l3.63 8.84L72.87 240H40ZM122.2 40h25.6L230 240h-32.87L118.57 48.84Z"
            />
            <path
              d="M255.78 40h32v200h-32ZM255.78 40h35.93l126.07 200h-35.94ZM385.78 40h32v200h-32Z"
            />
            <path
              d="M465.78 40h32v200h-32ZM573.59 40h41.19l-133 145.5v-45.05ZM523.55 94.75 619.78 240h-36.47l-80.9-122.12Z"
            />
            <path d="M645.44 40h32v200h-32Z" />
            <path
              d="M725.44 40h32v200h-32ZM725.44 40h116v28.16h-116ZM725.44 124.79h109.04v28.16H725.44ZM725.44 211.84h116V240h-116Z"
            />
            <path d="M875.85 40h32v200h-32ZM875.85 211.84h108V240h-108Z" />
          </svg>
          <span>Code</span>
        </a>
      </header>

      <div class="hero-bottom">
        <div class="hero-left">
          <h1>All your agents<br />in one spot.</h1>
          <p class="sub">
            Use Claude Code, Codex, and every other coding harness in a single interface. Free and
            open source with self hosted sync for your phone.
          </p>
        </div>

        <nav class="download-col" id="download-buttons" aria-label="Downloads and source">
          <a
            class="btn-glass primary"
            id="btn-mac"
            href="/download/mac"
            target="_blank"
            rel="noopener noreferrer"
            >Download for macOS</a
          >
          <a
            class="btn-glass"
            id="btn-win"
            href="/download/win"
            target="_blank"
            rel="noopener noreferrer"
            >Download for Windows</a
          >
          <a
            class="btn-glass"
            href="https://github.com/benank/ankielcode"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </nav>
      </div>
    </main>

    <script>
      (function () {
        var ua = navigator.userAgent || "";
        if (/Windows/i.test(ua)) {
          var macBtn = document.getElementById("btn-mac");
          var winBtn = document.getElementById("btn-win");
          var container = document.getElementById("download-buttons");
          if (macBtn && winBtn && container) {
            macBtn.classList.remove("primary");
            winBtn.classList.add("primary");
            container.insertBefore(winBtn, macBtn);
          }
        }

        var canvas = document.getElementById("canopy");
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext("2d");

        function hash(x, y) {
          var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
          return n - Math.floor(n);
        }

        function renderCanopy() {
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          var w = canvas.clientWidth;
          var h = canvas.clientHeight;
          if (!w || !h) return;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          ctx.fillStyle = "#030508";
          ctx.fillRect(0, 0, w, h);

          var isNarrow = w < 700;
          var span = Math.max(w, h * 0.96);

          var deep = ctx.createRadialGradient(
            isNarrow ? w * 0.55 : w * 0.5,
            isNarrow ? -h * 0.14 : -h * 0.18,
            isNarrow ? h * 0.08 : h * 0.05,
            w * 0.5,
            isNarrow ? h * 0.04 : h * 0.02,
            isNarrow ? span * 0.78 : w * 0.68,
          );
          deep.addColorStop(0.0, "rgba(255, 255, 255, 0.96)");
          deep.addColorStop(0.16, "rgba(195, 248, 255, 0.92)");
          deep.addColorStop(0.32, "rgba(42, 206, 245, 0.78)");
          deep.addColorStop(0.54, "rgba(16, 86, 204, 0.52)");
          deep.addColorStop(0.76, "rgba(6, 22, 72, 0.24)");
          deep.addColorStop(1.0, "rgba(3, 5, 8, 0)");
          ctx.fillStyle = deep;
          ctx.fillRect(0, 0, w, h);

          var flare = ctx.createRadialGradient(
            w * 0.62,
            isNarrow ? -h * 0.06 : h * 0.04,
            isNarrow ? 36 : 10,
            w * 0.56,
            isNarrow ? h * 0.04 : h * 0.08,
            isNarrow ? span * 0.52 : w * 0.42,
          );
          flare.addColorStop(
            0.0,
            isNarrow ? "rgba(255, 255, 255, 0.78)" : "rgba(255, 255, 255, 0.92)",
          );
          flare.addColorStop(0.28, "rgba(130, 242, 255, 0.55)");
          flare.addColorStop(0.6, "rgba(14, 114, 224, 0.24)");
          flare.addColorStop(1.0, "rgba(3, 5, 8, 0)");
          ctx.fillStyle = flare;
          ctx.fillRect(0, 0, w, h);

          var leftWing = ctx.createRadialGradient(
            isNarrow ? w * 0.14 : w * 0.22,
            isNarrow ? h * 0.12 : h * 0.14,
            isNarrow ? 30 : 10,
            isNarrow ? w * 0.2 : w * 0.24,
            h * 0.18,
            isNarrow ? span * 0.62 : w * 0.45,
          );
          leftWing.addColorStop(0.0, "rgba(32, 182, 236, 0.48)");
          leftWing.addColorStop(0.45, "rgba(12, 58, 168, 0.34)");
          leftWing.addColorStop(1.0, "rgba(3, 5, 8, 0)");
          ctx.fillStyle = leftWing;
          ctx.fillRect(0, 0, w, h);

          var cellW = 10;
          var cellH = 14;
          var glyphs = [" ", ".", ":", "+", "x", "0", "8", "#", "A", "N", "K"];
          ctx.font = '500 10px ui-monospace, "SF Mono", Menlo, monospace';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          var fieldW = isNarrow ? span * 0.65 : w * 0.54;
          var fieldH = isNarrow ? h * 0.62 : h * 0.64;

          for (var y = 8; y < h * 0.72; y += cellH) {
            for (var x = 6; x < w; x += cellW) {
              var nx = (x - w * 0.5) / fieldW;
              var ny = (y + h * 0.08) / fieldH;
              var dist = Math.sqrt(nx * nx * 0.82 + ny * ny * 1.18);
              var baseLum = Math.max(0, 1 - dist);
              if (baseLum <= 0.04) continue;

              var lum = Math.max(0, Math.min(1, baseLum + (hash(x, y) - 0.5) * 0.24));
              if (lum < 0.08) continue;

              var ch = glyphs[Math.min(glyphs.length - 1, Math.floor(lum * glyphs.length))];
              if (ch === " ") continue;

              var alpha = Math.min(0.42, lum * 0.44);
              ctx.fillStyle =
                lum > 0.72
                  ? "rgba(255, 255, 255, " + alpha + ")"
                  : lum > 0.42
                    ? "rgba(170, 244, 255, " + alpha + ")"
                    : "rgba(82, 168, 255, " + alpha * 0.85 + ")";
              ctx.fillText(ch, x, y);
            }
          }
        }

        renderCanopy();
        var resizeTimer = 0;
        window.addEventListener("resize", function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(renderCanopy, 120);
        });
      })();
    </script>
  </body>
